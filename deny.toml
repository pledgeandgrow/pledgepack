[advisories]
# cargo-deny checks for known vulnerabilities in dependencies.
# Each ignored advisory carries a `review-by` date. `scripts/check-stale-ignores.sh`
# (run in CI's `audit` job) fails the build once that date passes, so an ignore
# can't silently become permanent — see PRODUCTION-READINESS-100.md goal 6.
version = 2
ignore = [
    # rkyv 0.7 — OOB reads in archives with Rc/Arc. Transitive via parcel_sourcemap
    # (lightningcss). Cannot upgrade until parcel_sourcemap releases a new version.
    # Risk is low: only used for sourcemap encoding, not untrusted input.
    # review-by: 2026-12-15
    "RUSTSEC-2026-0235",
    # bincode 2.0.1 — flagged as unmaintained. This is the latest major version
    # and is stable/feature-complete. No viable drop-in replacement with serde support.
    # Will revisit if a maintained fork emerges.
    # review-by: 2026-12-15
    "RUSTSEC-2025-0141",
    # paste 1.0.15 — compile-time macro crate, no runtime code. Transitive via
    # oxc and lightningcss. Zero security risk.
    # review-by: 2026-12-15
    "RUSTSEC-2024-0436",
    # fxhash 0.2.1 — flagged unmaintained (not a vulnerability: no CVE, just an
    # abandoned repo). Transitive via scraper -> selectors; the latest scraper
    # (0.27.0) still pulls a selectors version that depends on fxhash, so
    # there is no upgrade path — the advisory itself says "No safe upgrade is
    # available!". Non-cryptographic hasher only, not used with untrusted
    # keys in a way that would enable a HashDoS. Will revisit once selectors
    # moves off fxhash upstream.
    # review-by: 2026-12-15
    "RUSTSEC-2025-0057",
]

[licenses]
# Allow only OSI-approved licenses
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "NCSA",
    "CDLA-Permissive-2.0",
]
# Allow specific exceptions
exceptions = []

[bans]
# Deny duplicate versions of the same crate
multiple-versions = "deny"
# Deny wildcards in Cargo.toml (i.e. a third-party dependency with no version
# requirement at all — a real supply-chain risk). Internal workspace path/
# `{ workspace = true }` dependencies between pledgepack-* crates are not that
# risk (they're pinned to the exact local crate) but are flagged the same way
# without this, so they're exempted explicitly rather than by disabling the
# check workspace-wide.
wildcards = "deny"
allow-wildcard-paths = true
#
# Exceptions for known duplicates, as of 2026-09-15 (crates/PRODUCTION-READINESS-100.md
# goals 4-5). Each entry below is a version this workspace does NOT treat as
# canonical; a bare `cargo tree -d` still shows the duplicate, but it is
# accounted for here so `cargo deny check bans` gives a real signal instead of
# ~50 permanent false positives. Re-run `cargo tree --workspace --duplicates`
# periodically (or when bumping wasmtime/oxc/lightningcss) and re-triage:
# remove an entry once its duplicate naturally resolves, add one if a new
# duplicate appears for a reason outside our control.
#
# Root causes, grouped:
#
# (A) wasmtime 48.0.2's own vendored toolchain (cranelift / wasm-tools)
#     pins a newer sibling of a crate this workspace's other dependents
#     (backtrace/miette, etc.) haven't caught up to yet. Re-check the exact
#     versions on every wasmtime bump — they drift with each release.
[[bans.skip]]
name = "addr2line"
version = "0.25.1"
[[bans.skip]]
name = "gimli"
version = "0.32.3"
[[bans.skip]]
name = "object"
version = "0.37.3"
[[bans.skip]]
name = "wasm-encoder"
version = "0.254.0"
[[bans.skip]]
name = "wast"
version = "35.0.2"
[[bans.skip]]
name = "io-lifetimes"
version = "2.0.4"
[[bans.skip]]
name = "windows-sys"
version = "0.52.0"
[[bans.skip]]
name = "windows-sys"
version = "0.59.0"
[[bans.skip]]
name = "windows-sys"
version = "0.60.2"
[[bans.skip]]
name = "windows-targets"
version = "0.52.6"
[[bans.skip]]
name = "windows_x86_64_gnu"
version = "0.52.6"
# windows-targets 0.52.6 (vs. 0.53.5, see group E) pulls all of its per-arch/
# per-toolchain sibling crates, not just the gnu ones above.
[[bans.skip]]
name = "windows_x86_64_gnullvm"
version = "0.52.6"
[[bans.skip]]
name = "windows_x86_64_msvc"
version = "0.52.6"
[[bans.skip]]
