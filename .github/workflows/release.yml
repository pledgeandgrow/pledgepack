name: Release

# Two ways to run this workflow:
#
#   1. Push a `v<semver>` tag (e.g. `v1.0.0-rc.1`)  → REAL release: signs
#      artifacts, creates the GitHub Release, publishes to npm.
#   2. Actions → Release → "Run workflow" (workflow_dispatch) with
#      `dry_run: true` (the default)  → REHEARSAL: runs the security gate,
#      builds every platform, verifies the archive set and the npm package
#      (`npm publish --dry-run`), uploads the artifacts for inspection — but
#      does NOT sign (cosign keyless signing writes to the public Rekor
#      transparency log), does NOT create a tag/release and does NOT publish
#      to npm. Set `dry_run: false` on a workflow_dispatch to do a real
#      release without pushing a tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0-rc.1). Must equal package.json / Cargo.toml.'
        required: true
        type: string
      dry_run:
        description: 'Rehearse only: build + verify, but do not sign, create a GitHub release, or publish to npm'
        required: false
        type: boolean
        default: true

# Least privilege by default; jobs that need more (release creation, OIDC for
# cosign / npm provenance) request it explicitly below.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Resolve + validate the version once, for every later job ──────────
  # Previously each job re-derived the version from GITHUB_REF, which is
  # `refs/heads/...` (not a tag) under workflow_dispatch — so the npm version
  # check and the post-publish smoke test could never work for a manual run.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Resolve and validate version
        id: v
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            DRY_RUN="$INPUT_DRY_RUN"
          else
            VERSION="$REF_NAME"
            DRY_RUN="false"
          fi
          VERSION="${VERSION#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$VERSION' is not a valid semver version"
            exit 1
          fi

          # npm refuses to publish a prerelease without an explicit dist-tag
          # (and must never move `latest` to an rc): use the first
          # prerelease identifier (1.0.0-rc.1 -> rc, 1.0.0-beta.2 -> beta).
          if [[ "$VERSION" == *-* ]]; then
            PRE="${VERSION#*-}"
            NPM_TAG="${PRE%%.*}"
            PRERELEASE="true"
          else
            NPM_TAG="latest"
            PRERELEASE="false"
          fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "dry_run=$DRY_RUN"
            echo "npm_tag=$NPM_TAG"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (npm tag: $NPM_TAG, dry-run: $DRY_RUN)"

      - name: Verify package.json / Cargo.toml / platforms.json / Cargo.lock agree with the version
        run: bash scripts/check-versions.sh "v${{ steps.v.outputs.version }}"

      - name: Verify platform lists agree
        run: node scripts/check-platform-lists.js

  # ── Security gate: block the release if a vulnerability is disclosed ──
  # between the last CI run on this commit and the tag push. ci.yml already
  # runs these checks on every push/PR, but a release can be tagged days or
  # weeks after the commit that produced it was last checked — this closes
  # that window. See PRODUCTION-READINESS-100.md goal 28.
  security-gate:
    name: Security Gate (audit + deny)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Work around stale rustup directory override
        # See the identical step in ci.yml's `test` job for why this exists.
        run: rustup override unset || true

      - name: Check ignored-advisory review dates haven't lapsed
        run: bash scripts/check-stale-ignores.sh

      - name: Check CHANGELOG.md has an entry for this release
        # check-changelog-entry.sh derives the version from a tag ref, or from
        # Cargo.toml otherwise (workflow_dispatch) — prepare has already
        # proven Cargo.toml == the requested version.
        run: bash scripts/check-changelog-entry.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit   # ignores come from .cargo/audit.toml

      - name: Run cargo-deny (licenses + advisories + bans + sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # ── Build native binaries for all platforms ───────────────────────────
  # The literal `target:` values below are checked against platforms.json by
  # scripts/check-platform-lists.js (run in `prepare`).
  build:
    name: Build ${{ matrix.target }}
    needs: [prepare, security-gate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig-target: x86_64-linux-gnu
            archive: tar.gz
            binary: pledge
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig-target: aarch64-linux-gnu
            archive: tar.gz
            binary: pledge
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            zig-target: x86_64-macos
            archive: tar.gz
            binary: pledge
          - os: macos-latest
            target: aarch64-apple-darwin
            zig-target: aarch64-macos
            archive: tar.gz
            binary: pledge
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            zig-target: x86_64-windows-msvc
            archive: zip
            binary: pledge.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            zig-target: aarch64-windows-msvc
            archive: zip
            binary: pledge.exe
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Work around stale rustup directory override
        # See the identical step in ci.yml's `test` job for why this exists.
        run: rustup override unset || true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.cross == true
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build native library (Zig)
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}-v2

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p pledgepack-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross == true && 'aarch64-linux-gnu-gcc' || '' }}

      - name: Package binary (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../pledge-${{ matrix.target }}.tar.gz ${{ matrix.binary }}

      - name: Package binary (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/${{ matrix.binary }}" -DestinationPath "pledge-${{ matrix.target }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pledge-${{ matrix.target }}
          path: pledge-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 30

  # ── Create GitHub Release with all binaries ───────────────────────────
  # In dry-run mode this job still downloads, verifies and checksums the
  # artifacts, but stops short of signing and releasing.
  github-release:
    name: GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for cosign's keyless signing: without it, cosign has no
      # GitHub Actions OIDC token to trade with Fulcio for a short-lived
      # cert, and falls back to an interactive device-code flow — which
      # always times out in CI (nobody's there to open the link and enter
      # the code within the 300s window). Confirmed failure mode: "Non-
      # interactive mode detected, using device flow... error obtaining
      # token: expired_token".
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Verify every platform in platforms.json has an archive
        run: |
          node -e "
            const fs = require('fs');
            const { platforms } = JSON.parse(fs.readFileSync('platforms.json', 'utf8'));
            const missing = platforms
              .map((p) => 'pledge-' + p.rustTarget + (p.archive === 'zip' ? '.zip' : '.tar.gz'))
              .filter((f) => !fs.existsSync('artifacts/' + f));
            if (missing.length) {
              console.error('Missing release archives: ' + missing.join(', '));
              process.exit(1);
            }
            console.log('All ' + platforms.length + ' platform archives present.');
          "

      - name: Generate checksums
        run: |
          cd artifacts
          for f in *; do
            sha256sum "$f" > "$f.sha256"
          done

      - name: Install cosign
        if: needs.prepare.outputs.dry_run != 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign artifacts
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          cd artifacts
          for f in *; do
            case "$f" in
              *.sha256|*.sig|*.pem) continue ;;
            esac
            cosign sign-blob --yes "$f" --output-signature "$f.sig" --output-certificate "$f.pem"
          done
        env:
          COSIGN_EXPERIMENTAL: "1"

      - name: Create GitHub Release
        if: needs.prepare.outputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          # When run via workflow_dispatch the tag may not exist yet; create
          # it on the exact commit that was built (ignored if the tag exists).
          target_commitish: ${{ github.sha }}
          name: v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## PledgePack v${{ needs.prepare.outputs.version }}

            ### Installation

            ```bash
            npm install -g pledgepack@${{ needs.prepare.outputs.npm_tag }}
            ```

            Or download the binary for your platform directly from the assets below.

            ### Platforms
            - `x86_64-unknown-linux-gnu` — Linux x64
            - `aarch64-unknown-linux-gnu` — Linux ARM64
            - `x86_64-apple-darwin` — macOS Intel
            - `aarch64-apple-darwin` — macOS Apple Silicon
            - `x86_64-pc-windows-msvc` — Windows x64
            - `aarch64-pc-windows-msvc` — Windows ARM64

            ### Verify
            Each archive ships a `.sha256` checksum and a Sigstore/cosign keyless
            signature (`.sig`) with its signing certificate (`.pem`). The npm
            installer checks the checksum (and the signature when `cosign` is
            installed) automatically; to verify a downloaded archive by hand:
            ```bash
            sha256sum -c pledge-<target>.tar.gz.sha256
            cosign verify-blob \
              --signature pledge-<target>.tar.gz.sig \
              --certificate pledge-<target>.tar.gz.pem \
              --certificate-identity-regexp '^https://github\.com/pledgeandgrow/pledgepack/\.github/workflows/release\.yml@refs/(tags|heads)/.+$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              pledge-<target>.tar.gz
            ```
            Then confirm the install (`pledgepack` when installed from npm,
            `pledge` when you extracted a standalone binary):
            ```bash
            pledgepack --version
            ```

      - name: Dry-run — keep artifacts for inspection
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ needs.prepare.outputs.version }}
          path: artifacts/*
          retention-days: 7

      - name: Dry-run summary
        if: needs.prepare.outputs.dry_run == 'true'
        run: |
          {
            echo "### Release dry run — v${{ needs.prepare.outputs.version }}"
            echo ""
            echo "Built and checksummed; **nothing was signed, tagged, released or published**."
            echo ""
            echo '```'
            ls -la artifacts/
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── Publish to npm ────────────────────────────────────────────────────
  npm-publish:
    name: Publish to npm
    needs: [prepare, github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `npm publish --provenance` signs a provenance statement with the
      # workflow's OIDC identity; without this it fails with a 4xx from
      # Fulcio ("Provenance generation in GitHub Actions requires
      # id-token: write permission").
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify package.json version matches the release version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: release version ($RELEASE_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version verified: $PKG_VERSION"

      - name: npm publish (dry run)
        if: needs.prepare.outputs.dry_run == 'true'
        run: npm publish --dry-run --access public --tag "${{ needs.prepare.outputs.npm_tag }}"

      - name: npm publish
        if: needs.prepare.outputs.dry_run != 'true'
        # --tag: mandatory for prereleases (npm rejects them without one, and
        # an rc must never become `latest`). --provenance: attest that the
        # package was built by this workflow (needs id-token: write above).
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not configured"
            exit 1
          fi
          npm publish --access public --provenance --tag "${{ needs.prepare.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Post-publish artifact smoke ─────────────────────────────────────────
  # Install the JUST-published package into a clean dir on every supported
  # OS and run the real binary — exercises postinstall's download → checksum
  # → extract → launch chain end to end, which nothing else in CI covers.
  # Skipped in dry-run mode (nothing was published to install).
  artifact-smoke:
    name: Artifact smoke (${{ matrix.os }})
    needs: [prepare, npm-publish]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Wait for npm propagation
        run: |
          # `npm view pledgepack@<exact version>` — a bare `npm view pledgepack
          # version` reports the `latest` dist-tag, which is not the release
          # candidate that was just published.
          for i in $(seq 1 30); do
            if [ "$(npm view "pledgepack@${RELEASE_VERSION}" version 2>/dev/null)" = "${RELEASE_VERSION}" ]; then
              echo "Published version visible on npm"
              exit 0
            fi
            echo "Waiting for npm propagation ($i/30)..."
            sleep 10
          done
          echo "Timed out waiting for npm propagation"
          exit 1
        shell: bash

      - name: Install published package in clean dir
        run: |
          SMOKE_DIR="$(mktemp -d)"
          echo "SMOKE_DIR=$SMOKE_DIR" >> "$GITHUB_ENV"
          cd "$SMOKE_DIR"
          npm init -y >/dev/null
          npm install "pledgepack@${RELEASE_VERSION}" --no-audit --no-fund
        shell: bash

      - name: Run the installed binary
        run: |
          cd "$SMOKE_DIR"
          node node_modules/pledgepack/bin/pledge.js --version
          node node_modules/pledgepack/bin/pledge.js --help
        shell: bash
