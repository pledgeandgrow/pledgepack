name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Test matrix: build + test on all supported platforms ──────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-wasip2

      - name: Work around stale rustup directory override
        # Hosted runners occasionally carry a stale rustup directory
        # override pointing at an uninstalled/unparseable toolchain. It
        # surfaces as "error: target tuple in channel name
        # 'stable-x86_64-pc-windows-gnu'" on every later cargo/rustup
        # invocation in the job, even though the preceding `rustup default`
        # reports success (see dtolnay/rust-toolchain#127). Clearing any
        # override up front is a harmless no-op when none exists.
        run: rustup override unset || true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build native library (Zig)
        run: zig build -Doptimize=ReleaseFast

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build WASM plugin test fixture
        # crates/wasm-plugin-host/tests/e2e.rs requires this artifact and PANICS
        # (by design, not a skip) if it's missing. It is a standalone crate
        # (not a workspace member — see its Cargo.toml) so it's built with its
        # own `cargo build`, not folded into the workspace build below.
        # See PRODUCTION-READINESS-100.md goals 1-2.
        # Built for wasm32-wasip2 — the target emits a real component
        # binary; a wasm32-wasip1 build is only a core module and cannot be
        # instantiated by wasmtime::component::Component.
        working-directory: crates/wasm-plugin-host/tests/test-plugin-guest
        run: cargo build --release --target wasm32-wasip2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-targets

      - name: Binary size budget (release build, Linux only)
        # Goal 61: LIMITATIONS.md's "Binary Size" entry claims a resolved
        # status (strip/lto/opt-level tuning) with no enforcement anywhere —
        # this is that enforcement. One platform is enough to catch a
        # regression; per-platform size varies but a bloat regression
        # (a new heavy dependency, LTO silently disabled, etc.) shows up on
        # any of them. 150MB is a generous sanity ceiling, not a tight
        # budget — this bundles Oxc, Lightning CSS, QuickJS, wasmtime,
        # tokio, and axum, so a tight budget would need real profiling to
        # set correctly; this catches a catastrophic regression (a doubled
        # binary, say) rather than gradual creep. Tighten once there's a
        # tracked size history to calibrate against (see goal 98).
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release -p pledgepack-cli
          SIZE_BYTES=$(stat -c%s target/release/pledge)
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          BUDGET_MB=150
          echo "pledge binary size: ${SIZE_MB}MB (budget: ${BUDGET_MB}MB)"
          if [ "$SIZE_MB" -gt "$BUDGET_MB" ]; then
            echo "ERROR: binary size ${SIZE_MB}MB exceeds the ${BUDGET_MB}MB budget"
            exit 1
          fi

      - name: npm pack + install artifact smoke (Linux only)
        # Exercises what npm consumers actually receive: tarball contents,
        # bin/pledge.js binary resolution, and a real binary launch. The
        # postinstall download path is covered by release.yml's
        # artifact-smoke job against the just-published package.
        if: matrix.os == 'ubuntu-latest'
        run: |
          SMOKE_DIR=$(mktemp -d)
          TARBALL=$(npm pack --pack-destination "$SMOKE_DIR" | tail -1)
          tar -xzf "$SMOKE_DIR/$TARBALL" -C "$SMOKE_DIR"
          PLATFORM_KEY="linux-x64"
          mkdir -p "$SMOKE_DIR/package/bin/$PLATFORM_KEY"
          cp target/release/pledge "$SMOKE_DIR/package/bin/$PLATFORM_KEY/pledge"
          chmod +x "$SMOKE_DIR/package/bin/$PLATFORM_KEY/pledge"
          "$SMOKE_DIR/package/bin/$PLATFORM_KEY/pledge" --version
          node "$SMOKE_DIR/package/bin/pledge.js" --version
          echo "Artifact smoke passed: packed tarball launches a real binary"

  # ── Security audit ────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Work around stale rustup directory override
        # See the identical step in the `test` job for why this exists.
        run: rustup override unset || true

      - name: Check ignored-advisory review dates haven't lapsed
        run: bash scripts/check-stale-ignores.sh

      - name: Check per-crate test counts haven't regressed
        run: bash scripts/check-min-test-counts.sh

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        run: cargo audit   # ignores come from .cargo/audit.toml

      - name: Run cargo-deny (licenses + advisories + bans + sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  # ── Production-readiness scorecard (goal 100) ──────────────────────────
  scorecard:
    name: Production-readiness scorecard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate scorecard
        run: bash scripts/generate-scorecard.sh --out scorecard.md

      - name: Print scorecard
        run: cat scorecard.md

      - name: Upload scorecard
        uses: actions/upload-artifact@v4
        with:
          name: production-readiness-scorecard
          path: scorecard.md
          retention-days: 90

  # ── Cross-compile verification (no test, just build) ──────────────────
  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zig-target: aarch64-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            zig-target: aarch64-macos
          # Goal 64: was previously only ever built in release.yml, never
          # checked on PRs — mirrors that job's exact target/zig-target
          # pairing (no extra cross-tool install needed; windows-latest
          # already carries the ARM64 MSVC toolchain).
          #
          # This target used to fail to compile at all: Zig 0.16.0's own
          # std.debug.SelfInfo for aarch64-windows-msvc has a
          # `@ptrCast increases pointer alignment` bug at
          # lib/std/debug/SelfInfo/Windows.zig:670 (LdrRegisterDllNotification
          # callback cast), pulled in transitively by the default panic
          # handler's stack-trace support. Fixed by overriding the panic
          # handler in native-sys/zig/lib.zig (see the comment there) rather
          # than downgrading Zig, so this stays on the same 0.16.0 every
          # other job uses.
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            zig-target: aarch64-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Work around stale rustup directory override
        # Hosted runners occasionally carry a stale rustup directory
        # override pointing at an uninstalled/unparseable toolchain. It
        # surfaces as "error: target tuple in channel name
        # 'stable-x86_64-pc-windows-gnu'" on every later cargo/rustup
        # invocation in the job, even though the preceding `rustup default`
        # reports success (see dtolnay/rust-toolchain#127). Clearing any
        # override up front is a harmless no-op when none exists.
        run: rustup override unset || true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build native library (Zig cross-compile)
        run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.zig-target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: cross-${{ matrix.target }}-v2

      - name: Cross-compile
        run: cargo build --release --target ${{ matrix.target }} -p pledgepack-cli
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  # ── Native ARM64 test execution ────────────────────────────────────────
  # Goal 63: the cross-compile job above only ever *builds* for ARM64,
  # never runs `cargo test` on it. Rather than set up QEMU emulation for
  # aarch64-unknown-linux-gnu, this uses runners that are ARM64 *natively*:
  # `macos-latest` has been Apple Silicon (arm64) since GitHub made it the
  # default, and `ubuntu-24.04-arm` is a real ARM64 Linux runner GitHub
  # provides for public repos — both let genuine ARM64 code run and be
  # tested directly, no emulation involved.
  arm64-test:
    name: Test (${{ matrix.os }}, native ARM64)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Work around stale rustup directory override
        # Hosted runners occasionally carry a stale rustup directory
        # override pointing at an uninstalled/unparseable toolchain. It
        # surfaces as "error: target tuple in channel name
        # 'stable-x86_64-pc-windows-gnu'" on every later cargo/rustup
        # invocation in the job, even though the preceding `rustup default`
        # reports success (see dtolnay/rust-toolchain#127). Clearing any
        # override up front is a harmless no-op when none exists.
        run: rustup override unset || true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build native library (Zig)
        run: zig build -Doptimize=ReleaseFast

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: arm64-test-${{ matrix.os }}-v1

      - name: Build WASM plugin test fixture
        working-directory: crates/wasm-plugin-host/tests/test-plugin-guest
        run: |
          rustup target add wasm32-wasip2
          cargo build --release --target wasm32-wasip2

      - name: Test
        run: cargo test --workspace --all-targets

  # ── Fuzz target build smoke test ────────────────────────────────────────
  # ENFORCED (blocking): builds — does not run; a real fuzzing run is
  # unbounded — every target under fuzz/ so they can't silently bitrot, and
  # then runs each for a short fixed budget as a smoke test. A failure here
  # fails CI. Actually fuzzing for longer is a manual / scheduled activity —
  # see fuzz/README.md and PRODUCTION-READINESS-100.md goal 29.
  fuzz-smoke:
    name: Fuzz targets build + smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Work around stale rustup directory override
        # Hosted runners occasionally carry a stale rustup directory
        # override pointing at an uninstalled/unparseable toolchain. It
        # surfaces as "error: target tuple in channel name
        # 'stable-x86_64-pc-windows-gnu'" on every later cargo/rustup
        # invocation in the job, even though the preceding `rustup default`
        # reports success (see dtolnay/rust-toolchain#127). Clearing any
        # override up front is a harmless no-op when none exists.
        run: rustup override unset || true

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build native library (Zig)
        run: zig build -Doptimize=ReleaseFast

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build

      - name: Smoke-run each fuzz target (30s)
        working-directory: fuzz
        run: |
          for t in $(cargo +nightly fuzz list); do
            echo "== fuzzing $t =="
            cargo +nightly fuzz run "$t" -- -max_total_time=30
          done

  # ── npm package dry-run (verify package.json is valid) ────────────────
  npm-dry-run:
    name: npm pack (dry-run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify package.json / Cargo.toml version consistency
        run: bash scripts/check-versions.sh

      - name: Verify platform-support lists agree
        run: node scripts/check-platform-lists.js

      - name: npm pack (dry-run)
        run: npm pack --dry-run

      - name: Verify package contents
        run: |
          npm pack 2>&1 | tee output.txt
          grep -q "bin/pledge.js" output.txt || { echo "ERROR: bin/pledge.js missing from package"; exit 1; }
          grep -q "bin/postinstall.js" output.txt || { echo "ERROR: bin/postinstall.js missing from package"; exit 1; }
          grep -q "platforms.json" output.txt || { echo "ERROR: platforms.json missing from package (postinstall.js requires it at runtime)"; exit 1; }
          grep -q "README.md" output.txt || { echo "ERROR: README.md missing from package"; exit 1; }

