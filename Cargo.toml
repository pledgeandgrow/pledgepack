[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/core",
    "crates/cache",
    "crates/resolver",
    "crates/dev-server",
    "crates/optimizer",
    "crates/js-plugin-host",
    "crates/adapter-react",
    "crates/adapter-solid",
    "crates/adapter-next",
    "crates/adapter-tanstack",
    "crates/adapter-pledgestack",
    "crates/task-system",
    "crates/task-system-macros",
    "crates/wasm-plugin-host",
    "native-sys",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
# None of these crates are published to crates.io today (see
# PRODUCTION-READINESS-100.md goal 62) — no workflow runs `cargo publish` or
# sets CARGO_REGISTRY_TOKEN. `publish = false` here (inherited via
# `publish.workspace = true` in each crate) guards against an accidental
# publish and satisfies cargo-deny's wildcard-dependency check, since
# publishable crates can't reference workspace siblings without an explicit
# version requirement. Flip a specific crate back to publishable (remove its
# `publish.workspace = true`, add a real `version` to its internal deps) only
# as a deliberate step per goal 60.
publish = false
authors = ["Pledge and Grow"]

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net", "sync", "signal"] }
futures = "0.3"

# HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }

# WebSocket for HMR
tokio-tungstenite = "0.26"

# Oxc for JS/TS/JSX compilation
oxc = { version = "0.141", features = ["transformer", "codegen", "minifier", "semantic", "ast_visit"] }

# Lightning CSS
# ACCEPTED RISK (decision recorded 2026-09-20): lightningcss has never shipped a
# 1.0 stable — 1.0.0-alpha.72 is the newest release on crates.io (checked with
# `cargo search`/`cargo info`), so there is nothing to upgrade to, and no
# drop-in replacement offers the same nesting/prefixing/minify/CSS-Modules
# coverage. Mitigations: (1) `default-features = false` — we only use
# stylesheet parse/minify/print + targets, so the `bundler`, `nodejs` and
# `sourcemap` features are off, which removes parcel_sourcemap and its
# vulnerable rkyv 0.7 (RUSTSEC-2026-0235) from the dependency tree entirely;
# (2) CSS output is covered by the crate's CSS tests. Re-check for a stable
# release on the review date below.
# review-by: 2026-12-15
lightningcss = { version = "1.0.0-alpha.72", default-features = false }

# Hashing (for cache keys and SRI)
blake3 = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Base64 encoding for inline assets
base64 = "0.23"

# Image processing (decode, resize, encode WebP/JPEG/PNG)
image = { version = "0.25", features = ["jpeg", "png", "webp", "gif"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# CLI UX
clap_complete = "4"
indicatif = "0.18"
inquire = "0.9"

# File watching
notify = "8"
notify-debouncer-full = "0.7"

# C library bindings (native file watcher on Linux)
libc = "0.2"

# Windows API bindings (native file watcher on Windows)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_Security"] }

# Parallelism
rayon = "1"
dashmap = "6"

# Global allocator (performance)
mimalloc = "0.1"
tikv-jemallocator = { version = "0.7" }

# Typed UTF-8 paths
camino = "1"

# Fast glob pattern matching
globset = "0.4"

# Regular expression engine
regex = "1"

# Memory-mapped file I/O
memmap2 = "0.9"

# CLI tables
comfy-table = "7"

# YAML parsing (pure Rust, YAML 1.2, panic-free parsing by design).
# Migrated from noyalib (0.0.x pre-1.0, minimal history) to serde-saphyr 1.x, a
# maintained stable-major crate. (serde_yaml itself is archived upstream.)
# Only used for `import data from './x.yaml'` (crates/core/src/asset_pipeline.rs).
serde-saphyr = "1.3"

# Source-context error diagnostics
miette = { version = "7", features = ["fancy"] }

# Man page generation
clap_mangen = "0.3"

# Human-readable file sizes
humansize = "2"

# Diff algorithm for HMR patches
similar = { version = "2", features = ["text"] }

# Cross-platform browser opening
opener = "0.8"

# Local IP address detection for network URL display
local-ip-address = "0.6"

# JSON Schema generation for config validation/IDE support
schemars = "1"

# Pure Rust Sass/SCSS compiler
grass = "0.13"

# TOML parsing
toml = "1.1"

# HTTP client for plugin registry
ureq = { version = "3", features = ["json"] }

# HTML parsing for security features (SRI injection, CSP analysis)
scraper = "0.22"

# HTTP client for remote cache
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# Temporary directories for tests
tempfile = "3"

# Benchmarking (PRODUCTION-READINESS-100.md goal 98)
criterion = "0.5"

# Compression for cache entries
zstd = "0.13"

# Digital signatures for cache integrity
ed25519-dalek = { version = "2", features = ["rand_core"] }
# Constant-time comparison of key/hash material (already in the lockfile as an
# ed25519-dalek dependency).
subtle = "2"

# Internal crates
pledgepack-core = { path = "crates/core" }
pledgepack-cache = { path = "crates/cache" }
pledgepack-resolver = { path = "crates/resolver" }
pledgepack-dev-server = { path = "crates/dev-server" }
pledgepack-optimizer = { path = "crates/optimizer" }
pledgepack-js-plugin-host = { path = "crates/js-plugin-host" }
pledgepack-adapter-react = { path = "crates/adapter-react" }
pledgepack-adapter-solid = { path = "crates/adapter-solid" }
pledgepack-adapter-next = { path = "crates/adapter-next" }
pledgepack-adapter-tanstack = { path = "crates/adapter-tanstack" }
pledgepack-adapter-pledgestack = { path = "crates/adapter-pledgestack" }
pledgepack-task-system = { path = "crates/task-system" }
pledgepack-wasm-plugin-host = { path = "crates/wasm-plugin-host" }

# WASM Component Model plugin host
wasmtime = "48"
wasmtime-wasi = "48"
parking_lot = "0.12"
pledgepack-task-system-macros = { path = "crates/task-system-macros" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true

[profile.release-fast]
inherits = "release"
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false

[profile.dev]
opt-level = 0
incremental = true
