[package]
name = "pledgepack-js-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "JS plugin host for PledgePack"
repository = "https://github.com/pledgeandgrow/pledgepack"
keywords = ["bundler", "build", "rust"]
categories = ["web-programming", "compilers"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
rquickjs = "0.12"
pledgepack-core = { workspace = true }
# Parses transformed test modules to rewrite ESM imports/exports for the test bundle.
oxc = { workspace = true }
# Content-hash check for the plugin signing sidecar (goal 12).
blake3 = { workspace = true }

[dev-dependencies]
tempfile = "3"
ed25519-dalek = { workspace = true }
hex = { workspace = true }
