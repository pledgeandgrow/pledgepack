[package]
name = "pledgepack-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "CLI for PledgePack bundler"
repository = "https://github.com/pledgeandgrow/pledgepack"
keywords = ["bundler", "build", "rust"]
categories = ["web-programming", "compilers"]

[[bin]]
name = "pledge"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
pledgepack-core = { workspace = true }
pledgepack-dev-server = { workspace = true }
pledgepack-cache = { workspace = true }
pledgepack-resolver = { workspace = true }
pledgepack-js-plugin-host = { workspace = true }
pledgepack-adapter-react = { workspace = true }
pledgepack-adapter-solid = { workspace = true }
pledgepack-adapter-next = { workspace = true }
pledgepack-adapter-tanstack = { workspace = true }
pledgepack-adapter-pledgestack = { workspace = true }
pledgepack-optimizer = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
notify = { workspace = true }
rayon = { workspace = true }
dialoguer = "0.11"
console = "0.15"
mimalloc = { workspace = true }
camino = { workspace = true }
clap_complete = { workspace = true }
indicatif = { workspace = true }
inquire = { workspace = true }
globset = { workspace = true }
comfy-table = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
clap_mangen = { workspace = true }
schemars = { workspace = true }
dirs = "6"

[features]
default = []
# Enable jemalloc with heap profiling support instead of mimalloc
# Note: jemalloc is not supported on Windows MSVC
jemalloc = ["dep:tikv-jemallocator"]

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
