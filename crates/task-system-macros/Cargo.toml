[package]
name = "pledgepack-task-system-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Proc macros for the PledgePack task system"
repository = "https://github.com/pledgeandgrow/pledgepack"
keywords = ["bundler", "build", "rust"]
categories = ["web-programming", "compilers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "parsing", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
