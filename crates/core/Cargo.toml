[package]
name = "pledgepack-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Core bundler engine for PledgePack"
repository = "https://github.com/pledgeandgrow/pledgepack"
keywords = ["bundler", "build", "rust"]
categories = ["web-programming", "compilers"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
# Real Ed25519 signature verification for plugin signing (G12.35) — was
# previously a non-empty-string check with the real check commented out.
# See PRODUCTION-READINESS-100.md goal 11.
ed25519-dalek = { workspace = true }
# Constant-time comparison of public keys / hashes in plugin signing.
subtle = { workspace = true }
# CSPRNG for a genuinely unguessable build-time obfuscation key (was derived
# from SystemTime::now(), see PRODUCTION-READINESS-100.md goal 15). Pinned to
# "0.8" to match crates/cache's existing pin rather than adding a 4th locked
# `rand` version (see deny.toml's rand skip-entries).
rand = "0.8"
dashmap = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true }

# Oxc for JS/TS/JSX transforms
oxc = { workspace = true }

# Lightning CSS for CSS transforms, minification, CSS modules
lightningcss = { workspace = true }

# Base64 for inline asset encoding
base64 = { workspace = true }

# Image processing (decode, resize, encode)
image = { workspace = true }

# Cache (function-level incremental cache with disk persistence)
pledgepack-cache = { path = "../cache" }

# Task-graph engine backing task_transform.rs (also used by wasm-plugin-host
# via pledgepack_core::task_transform::PluginTransformResult)
pledgepack-task-system = { workspace = true }

# FFI to Zig native library
pledgepack-native-sys = { path = "../../native-sys" }

# Compression (gzip + brotli)
flate2 = "1"
brotli = "7"

# Serialization for module graph persistence
bincode = { workspace = true }

# Date/time formatting for telemetry dashboard (#101)
chrono = "0.4"

# Fast glob pattern matching
globset = { workspace = true }

# Regular expression engine
regex = { workspace = true }

# Memory-mapped file I/O
memmap2 = { workspace = true }

# CLI tables
comfy-table = { workspace = true }

# File watcher with built-in debouncing
notify-debouncer-full = { workspace = true }
notify = { workspace = true }

# YAML parsing
serde-saphyr = { workspace = true }

# Source-context error diagnostics
miette = { workspace = true }

# Human-readable file sizes
humansize = { workspace = true }

# JSON Schema generation for config validation
schemars = { workspace = true }

# Pure Rust Sass/SCSS compiler
grass = { workspace = true }

# TOML parsing
toml = { workspace = true }

# JSON5 parsing (handles comments, trailing commas, unquoted keys in config files)
json5 = "0.4"

# HTTP client for plugin registry
ureq = { workspace = true }

# HTML parsing for security features (SRI injection, CSP analysis)
scraper = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "transform_bench"
harness = false

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
