[advisories]
# Each ignored advisory carries a `review-by` date. `scripts/check-stale-ignores.sh`
# (run in CI's `audit` job) fails the build once that date passes, so an ignore
# can't silently become permanent — see PRODUCTION-READINESS-100.md goal 6.
ignore = [
    # rkyv 0.7 — OOB reads in archives with Rc/Arc. Transitive via parcel_sourcemap
    # (lightningcss). Cannot upgrade until parcel_sourcemap releases a new version.
    # review-by: 2026-12-15
    "RUSTSEC-2026-0235",
    # bincode 2.0.1 — flagged as unmaintained. Latest major version, stable.
    # review-by: 2026-12-15
    "RUSTSEC-2025-0141",
    # paste 1.0.15 — compile-time macro crate, no runtime code. Transitive.
    # review-by: 2026-12-15
    "RUSTSEC-2024-0436",
]
